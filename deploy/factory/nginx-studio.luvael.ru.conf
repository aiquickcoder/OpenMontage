# WebSocket upgrade for the farm agent and live device screens (unique name: this file is included in http{})
map $http_upgrade $studio_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.luvael.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.luvael.ru;

    ssl_certificate     /etc/letsencrypt/live/studio.luvael.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.luvael.ru/privkey.pem;

    client_max_body_size 1m;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Approved releases for the phone farm. Bearer token from /opt/openmontage/.env (RELEASE_TOKEN).
    location /releases/ {
        if ($http_authorization != "Bearer __RELEASE_TOKEN__") { return 401; }
        alias /srv/factory/releases/;
        location ~ ^/releases/pending/ { return 404; }
        add_header Cache-Control "no-store";
    }

    # Studio API (uvicorn on 127.0.0.1:4760). SSE needs buffering off; the app also sends X-Accel-Buffering.
    location /api/ {
        proxy_pass http://127.0.0.1:4760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_conn_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }

    # Studio SPA (built by install.sh)
    location / {
        root /opt/openmontage/studio/web/dist;
        try_files $uri /index.html;
        location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
        location = /index.html {
            # a nested add_header drops the server-level ones, so repeat them
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
    }
}
